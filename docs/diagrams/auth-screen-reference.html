<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall — Auth Screen Reference</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#070809; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .frame { width:100%; max-width:920px; background:#0d0f12; border-radius:12px; overflow:hidden; min-height:540px;
           display:flex; border:0.5px solid #1f2329; }
  .left { flex:1; padding:44px 48px; display:flex; flex-direction:column; justify-content:center; min-width:0; position:relative; overflow:hidden; }
  .right { flex:1; background:#0a0c0f; position:relative; overflow:hidden; border-left:0.5px solid #1f2329; min-width:0; }
  .rc-signin{ transition:all .18s ease; }
  .rc-signin:hover{ box-shadow:0 0 22px 0 rgba(47,107,255,.55); transform:translateY(-1px); }
  .rc-field{ transition:all .18s ease; }
  .rc-field:hover{ border-color:#3a4250; }
  .rc-field:focus-within{ border-color:#2f6bff; box-shadow:0 0 0 3px rgba(47,107,255,.14); }
  .rc-google{ transition:all .18s ease; }
  .rc-google:hover{ border-color:#3a4250; background:#15181d; }
  .rc-glow{ animation:rcglow 14s ease-in-out infinite; }
  @keyframes rcglow{ 0%,100%{transform:translate(-10%,-10%) scale(1);opacity:.5} 50%{transform:translate(10%,12%) scale(1.25);opacity:.8} }
  @media (prefers-reduced-motion: reduce){ .rc-glow{animation:none} }
  label{ color:#b4b9c0; font-size:11px; display:block; margin-bottom:5px; }
  .field-wrap{ display:flex; align-items:center; background:#15181d; border:0.5px solid #2a2f37; border-radius:8px; padding:0 11px; margin-bottom:15px; }
  .field-wrap input{ flex:1; min-width:0; background:none; border:none; padding:10px 8px; color:#e8eaed; font-size:13px; outline:none; }
  .field-wrap i{ font-size:15px; color:#8b9096; }
</style>
</head>
<body>
<div class="frame">

  <div class="left">
    <div class="rc-glow" style="position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(47,107,255,0.13),transparent 70%);top:0;left:0;pointer-events:none"></div>

    <div style="position:relative">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:38px">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#2f6bff"/><circle cx="11" cy="12" r="2.3" fill="#fff"/><circle cx="21" cy="11" r="2.3" fill="#fff"/><circle cx="16" cy="20" r="2.3" fill="#fff"/><circle cx="22" cy="21" r="1.8" fill="#bcd0ff"/><line x1="11" y1="12" x2="21" y2="11" stroke="#fff" stroke-width="1.1" opacity=".7"/><line x1="11" y1="12" x2="16" y2="20" stroke="#fff" stroke-width="1.1" opacity=".7"/><line x1="21" y1="11" x2="16" y2="20" stroke="#fff" stroke-width="1.1" opacity=".7"/><line x1="16" y1="20" x2="22" y2="21" stroke="#fff" stroke-width="1.1" opacity=".5"/></svg>
        <span style="color:#e8eaed;font-size:17px;font-weight:500;letter-spacing:.2px">Recall</span>
      </div>

      <div style="color:#e8eaed;font-size:23px;font-weight:500;margin-bottom:5px">Welcome back</div>
      <div style="color:#8b9096;font-size:13px;margin-bottom:28px">Sign in to continue studying</div>

      <label>Email</label>
      <div class="rc-field field-wrap">
        <i class="ti ti-mail"></i>
        <input type="text" value="amaan@example.com"/>
      </div>

      <label>Password</label>
      <div class="rc-field field-wrap" style="margin-bottom:9px">
        <i class="ti ti-lock"></i>
        <input type="password" value="password"/>
        <i class="ti ti-eye" style="cursor:pointer"></i>
      </div>

      <div style="text-align:right;margin-bottom:18px"><span style="color:#2f6bff;font-size:11px;cursor:pointer">Forgot password?</span></div>

      <button class="rc-signin" style="width:100%;background:#2f6bff;border:none;border-radius:8px;padding:11px;color:#fff;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:15px">Sign in</button>

      <button class="rc-google" style="width:100%;background:#0d0f12;border:0.5px solid #2a2f37;border-radius:8px;padding:10px;color:#e8eaed;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:22px"><i class="ti ti-brand-google" style="font-size:15px"></i>Continue with Google</button>

      <div style="color:#8b9096;font-size:12px">New here? <span style="color:#2f6bff;cursor:pointer">Create an account</span></div>
    </div>
  </div>

  <div class="right">
    <canvas id="rc-particles" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
    <div style="position:absolute;bottom:38px;left:34px;right:34px;z-index:2">
      <div style="color:#e8eaed;font-size:15px;font-weight:500;line-height:1.5;margin-bottom:6px">Your notes, instantly searchable.</div>
      <div style="color:#8b9096;font-size:12px;line-height:1.6">Recall turns your course material into answers — ask anything, grounded in what you uploaded.</div>
    </div>
  </div>

</div>
<script>
(function(){
  const c=document.getElementById('rc-particles');if(!c)return;
  const ctx=c.getContext('2d');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w,h,dpr;
  function size(){dpr=window.devicePixelRatio||1;w=c.offsetWidth;h=c.offsetHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  size();window.addEventListener('resize',size);
  const N=28,pts=[];
  for(let i=0;i<N;i++){pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:Math.random()*1.6+1});}
  function frame(){
    ctx.clearRect(0,0,w,h);
    for(let i=0;i<N;i++){const p=pts[i];p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;}
    for(let i=0;i<N;i++){for(let j=i+1;j<N;j++){const a=pts[i],b=pts[j];const dx=a.x-b.x,dy=a.y-b.y;const d=Math.sqrt(dx*dx+dy*dy);
      if(d<100){ctx.strokeStyle='rgba(47,107,255,'+(0.16*(1-d/100))+')';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}}
    for(let i=0;i<N;i++){const p=pts[i];ctx.fillStyle='rgba(91,134,255,.65)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
    if(!reduce)requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
