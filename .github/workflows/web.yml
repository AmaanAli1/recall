# CI for the Next.js frontend in /web.
#
# Runs on every pull request and on pushes to main.
# A `changes` job checks whether web/ changed; if not,
# the four jobs below are skipped (and count as passed).
#
# Branch protection on main should require all four checks to pass.

name: web

on:
  # No path filters here on purpose: required checks
  # must always report, or non-web PRs can't merge.
  # The `changes` job below decides what really runs.
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older, still-running run.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

env:
  # The frontend talks to a typed mock API until each backend endpoint ships.
  NEXT_PUBLIC_USE_MOCK_API: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Looks at the files this PR/push changed and
  # outputs web=true/false for the other jobs.
  changes:
    runs-on: ubuntu-latest
    # Least privilege: it only needs to read the
    # repo and the PR's list of changed files.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/web.yml'
  lint:
    # Wait for `changes`, then run only if web/ changed.
    # Skipped = reported as passed to branch protection.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  unit:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run Playwright
        run: npm run test:e2e
      # On failure, keep the HTML report + traces so you can debug from CI:
      # download the artifact, then `npx playwright show-report` locally.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
