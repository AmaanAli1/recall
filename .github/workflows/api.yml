# CI for the FastAPI service in /api: lint, format and
# tests. Never talks to Supabase or OpenAI (the tests
# use no real secrets).

name: api

on:
  # No path filters here on purpose: once api-lint and
  # api-test are required checks, they must report on
  # EVERY PR. The `changes` job decides what really runs.
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older run.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  # Job 1: did anything in api/ change?
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # paths-filter reads the PR's changed files
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              # The golden set is test data: test_dyno_golden.py
              # loads it, so editing it must rerun api-test.
              - 'dyno/**'
              - '.github/workflows/api.yml'

  # Job 2: Ruff. `check` = lint rules, `format --check`
  # = fails if any file isn't formatted (it changes
  # nothing in CI).
  api-lint:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      # --locked: fail if uv.lock doesn't match
      # pyproject.toml (someone forgot to commit it).
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check

  # Job 3: pytest.
  api-test:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - run: uv sync --locked
      - run: uv run pytest

  # Job 4: the container image. Built on GitHub's machine
  # (no Docker needed on a laptop), then started and
  # checked, so a broken Dockerfile fails the PR instead of
  # the deploy. Nothing is pushed anywhere.
  api-image:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (same flags as api-deploy.yml)
        run: docker build --provenance=false --platform linux/amd64 -t recall-api:ci .
      - name: Start it with no secrets and check /health
        run: |
          docker run -d --name api -p 8000:8000 recall-api:ci
          # Give uvicorn a few seconds to start.
          for i in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8000/health && break
            sleep 1
          done
          echo
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          echo
      - name: Show logs if it failed
        if: failure()
        run: docker logs api || true
      - name: No secrets, PDFs or tests inside the image
        run: |
          docker run --rm recall-api:ci ls -a /app | tee files.txt
          if grep -qE '^(\.env|samples|tests)$' files.txt; then
            echo "::error::.env, samples/ or tests/ ended up in the image"; exit 1
          fi
      - name: Runs as the non-root user
        run: test "$(docker run --rm recall-api:ci id -u)" = "10001"
